[project]
name = "task-calendar"
version = "0.1.0"
description = "Desktop task calendar application with PostgreSQL storage."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Project team" }
]
dependencies = [
    "psycopg[binary]>=3.2",
    "PySide6>=6.7",
]

[project.scripts]
task-calendar = "todo_app.gui:main"
task-calendar-cli = "todo_app.cli:main"
